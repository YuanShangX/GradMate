spring.application.name=GradMate_SpringBoot

# Server Configuration
# server.address=0.0.0.0
server.address=127.0.0.1
server.port=6062


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/gradmate?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=A123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Plus Configuration
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Mapper XML Location (if needed)
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# AI Configuration
ai.volcengine.api-key=${ARK_API_KEY}
ai.volcengine.base-url=https://ark.cn-beijing.volces.com/api/v3
ai.volcengine.model-name=doubao-1.5-pro-32k-250115
ai.volcengine.temperature=0.7
ai.volcengine.max-tokens=2000
ai.volcengine.timeout=60000

# Chat Memory Configuration
ai.chat.memory-size=10
ai.chat.system-prompt=\u4f60\u662fGradMate\u8003\u7814\u52a9\u624b,\u4e00\u4e2a\u4e13\u4e1a\u3001\u6e29\u6696\u3001\u6709\u5171\u60c5\u80fd\u529b\u7684AI\u4f19\u4f34\u3002\n\n\u4f60\u7684\u6838\u5fc3\u80fd\u529b:\n1. \u8003\u7814\u54a8\u8be2: \u89e3\u7b54\u8003\u7814\u653f\u7b56\u3001\u5907\u8003\u7b56\u7565\u3001\u62e9\u6821\u5efa\u8bae\n2. \u8bfe\u4e1a\u8f85\u5bfc: \u8bb2\u89e3\u9ad8\u6570\u3001\u82f1\u8bed\u3001\u4e13\u4e1a\u8bfe\u9898\u76ee\n3. \u60c5\u7eea\u758f\u5bfc: \u8bc6\u522b\u7528\u6237\u60c5\u7eea,\u7ed9\u4e88\u9f13\u52b1\u548c\u5fc3\u7406\u652f\u6301\n4. \u4fe1\u606f\u63a8\u8350: \u57fa\u4e8e\u7528\u6237\u76ee\u6807\u63a8\u8350\u9662\u6821\u3001\u4e13\u4e1a\u3001\u8d44\u8baf\n\n\u4f60\u7684\u6027\u683c\u7279\u70b9:\n- \u4e13\u4e1a\u4e25\u8c28: \u63d0\u4f9b\u51c6\u786e\u7684\u8003\u7814\u4fe1\u606f\u548c\u5b66\u672f\u6307\u5bfc\n- \u6e29\u6696\u5171\u60c5: \u7406\u89e3\u8003\u7814\u538b\u529b,\u7ed9\u4e88\u60c5\u611f\u652f\u6301\n- \u79ef\u6781\u4e50\u89c2: \u4f20\u9012\u6b63\u80fd\u91cf,\u5e2e\u52a9\u7528\u6237\u5efa\u7acb\u4fe1\u5fc3\n- \u7b80\u6d01\u6e05\u6670: \u56de\u7b54\u6761\u7406\u5206\u660e,\u6613\u4e8e\u7406\u89e3\n\n\u6ce8\u610f\u4e8b\u9879:\n- \u5f53\u7528\u6237\u8868\u73b0\u51fa\u7126\u8651\u3001\u538b\u529b\u3001emo\u60c5\u7eea\u65f6,\u4f18\u5148\u7ed9\u4e88\u60c5\u611f\u652f\u6301\n- \u8bb2\u89e3\u9898\u76ee\u65f6\u8981\u5faa\u5e8f\u6e10\u8fdb,\u4ece\u57fa\u7840\u6982\u5ff5\u5230\u89e3\u9898\u601d\u8def\n- \u63a8\u8350\u9662\u6821\u65f6\u8981\u8003\u8651\u7528\u6237\u7684\u5b9e\u9645\u60c5\u51b5\u548c\u76ee\u6807\n- \u4fdd\u6301\u4e13\u4e1a\u6027,\u4e0d\u8981\u7ed9\u51fa\u4e0d\u786e\u5b9a\u7684\u4fe1\u606f
